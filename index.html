<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Women's Day 20/10</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #fdf2f4;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .floating-heart {
            position: absolute;
            color: #d81b60;
            font-size: 18px;
            animation: flyUp 4s linear infinite;
            opacity: 0.6;
            z-index: 1;
        }

        @keyframes flyUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .rose-container {
            width: 240px;
            height: 260px;
            margin-bottom: 20px;
            animation: floatRose 3s ease-in-out infinite;
        }

        @keyframes floatRose {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .click-btn-text {
            background: none;
            border: none;
            color: #c2185b;
            font-size: 30px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }

        .click-btn-text:hover {
            transform: scale(1.08);
        }

        #letter-screen {
            display: none;
            position: absolute;
            width: 90%;
            max-width: 550px;
            background: #fff0f3;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            padding: 30px 20px;
            text-align: center;
            z-index: 20;
            transform: scale(0);
            animation: zoomIn 0.8s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px dashed #ff80ab;
        }

        @keyframes zoomIn {
            to { transform: scale(1); }
        }

        .letter-header {
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            color: #d81b60;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .letter-content {
            background: #ffffff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
        }

        .gift-box-area {
            width: 100px;
            height: 120px;
            margin: 0 auto 15px auto;
            animation: bounceGift 2s ease-in-out infinite;
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .message-title {
            font-size: 24px;
            font-weight: 700;
            color: #c2185b;
            margin-bottom: 10px;
            font-family: 'Dancing Script', cursive;
        }

        .message-body {
            line-height: 1.6;
            color: #4a4a4a;
            font-family: 'Dancing Script', cursive;
            font-size: 22px;
            min-height: 80px;
        }
    </style>
</head>
<body>

    <div class="floating-heart" style="left: 10%; animation-delay: 0s;">❤️</div>
    <div class="floating-heart" style="left: 30%; animation-delay: 2s;">💖</div>
    <div class="floating-heart" style="left: 70%; animation-delay: 1s;">💗</div>
    <div class="floating-heart" style="left: 85%; animation-delay: 3s;">💓</div>

    <!-- Màn hình 1: Bông hoa hồng đã chuẩn hóa tỉ lệ -->
    <div id="welcome-screen">
        <div class="rose-container">
            <svg viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Thân hoa -->
                <path d="M115 110 Q100 150 70 190" stroke="#4caf50" stroke-width="4" stroke-linecap="round"/>
                <!-- Lá trái -->
                <path d="M80 155 C60 148 50 130 65 125 C80 120 90 140 80 155 Z" fill="#81c784" stroke="#4caf50" stroke-width="2"/>
                <!-- Lá phải -->
                <path d="M98 145 C120 140 130 155 115 165 C100 175 90 155 98 145 Z" fill="#81c784" stroke="#4caf50" stroke-width="2"/>
                <!-- Đài hoa -->
                <path d="M100 102 L115 112 L110 98 Z" fill="#4caf50"/>

                <!-- Đóa hoa hồng (sắp xếp các lớp nét thanh mượt mà) -->
                <path d="M100 95 C75 95 60 70 70 45 C75 30 95 20 115 35 C135 20 155 30 160 45 C170 70 150 95 125 95 C115 95 105 90 100 95 Z" fill="#d81b60" stroke="#ad1457" stroke-width="2.5"/>
                <path d="M115 35 C105 55 125 75 115 90 C105 75 125 55 115 35 Z" fill="#e91e63" stroke="#ad1457" stroke-width="2"/>
                <path d="M85 55 C95 55 105 65 110 78 C95 72 80 68 85 55 Z" fill="#c2185b"/>
                <path d="M145 55 C135 55 125 65 120 78 C135 72 150 68 145 55 Z" fill="#c2185b"/>
                <path d="M105 45 C100 38 112 32 120 40 C125 45 118 52 112 50 C108 48 106 47 105 45 Z" fill="#f48fb1"/>
            </svg>
        </div>
        
        <button class="click-btn-text" onclick="openLetter()">
            Click me now !
        </button>
    </div>

    <!-- Màn hình 2: Bức thư -->
    <div id="letter-screen">
        <div class="letter-header">
            <span>From With Love 20/10</span>
            <span>Happy Women's Day!</span>
        </div>
        <div class="letter-content">
            <div class="gift-box-area">
                <svg viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 70V95" stroke="#999" stroke-width="2" stroke-dasharray="2 2"/>
                    <path d="M50 15C35 -2 10 10 10 30C10 50 50 70 50 70C50 70 90 50 90 30C90 10 65 -2 50 15Z" fill="#ff4081"/>
                    <rect x="30" y="95" width="40" height="25" fill="#f44336" rx="3"/>
                    <rect x="27" y="90" width="46" height="7" fill="#e53935" rx="2"/>
                    <path d="M50 90V120" stroke="#ffeb3b" stroke-width="4"/>
                    <path d="M30 105H70" stroke="#ffeb3b" stroke-width="4"/>
                </svg>
            </div>
            <div class="message-title">Gửi cậu!</div>
            <div class="message-body" id="typed-text"></div>
        </div>
    </div>

    <script>
        const fullMessage = "Hôm nay là ngày 20/10. Xin gửi lời chúc tới người tớ yêu thương nhất. Luôn vui vẻ, luôn hạnh phúc và luôn may mắn trong cuộc sống, ngày càng xinh đẹp. Xin gửi tất cả lời chúc tốt đẹp đến cậu. Love You <3";
        
        function openLetter() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('letter-screen').style.display = 'block';

            let i = 0;
            const speed = 50;
            function typeWriter() {
                if (i < fullMessage.length) {
                    document.getElementById("typed-text").innerHTML += fullMessage.charAt(i);
                    i++;
                    setTimeout(typeWriter, speed);
                }
            }
            setTimeout(typeWriter, 400);
        }
    </script>
</body>
</html>
