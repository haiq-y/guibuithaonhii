<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Women's Day 20/10</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: #f5eef0;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Trái tim bay hiệu ứng nền */
        .floating-heart {
            position: absolute;
            color: #d81b60;
            font-size: 18px;
            animation: flyUp 4s linear infinite;
            opacity: 0.6;
            z-index: 1;
        }

        @keyframes flyUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Màn hình 1: Bông hồng + Nút bấm */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .rose-container {
            width: 240px;
            height: 260px;
            margin-bottom: 25px;
            animation: floatRose 3s ease-in-out infinite;
        }

        @keyframes floatRose {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .click-btn-text {
            background: none;
            border: none;
            color: #b71c1c;
            font-size: 32px;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }

        .click-btn-text:hover {
            transform: scale(1.08);
        }

        /* Màn hình 2: Bức thư */
        #letter-screen {
            display: none;
            position: absolute;
            width: 90%;
            max-width: 550px;
            background: #fff0f3;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            padding: 30px 20px;
            text-align: center;
            z-index: 20;
            transform: scale(0);
            animation: zoomIn 0.8s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px dashed #ff80ab;
        }

        @keyframes zoomIn {
            to { transform: scale(1); }
        }

        .letter-header {
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            color: #d81b60;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .letter-content {
            background: #ffffff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
        }

        .gift-box-area {
            width: 100px;
            height: 120px;
            margin: 0 auto 15px auto;
            animation: bounceGift 2s ease-in-out infinite;
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .message-title {
            font-size: 24px;
            font-weight: 700;
            color: #c2185b;
            margin-bottom: 10px;
            font-family: 'Dancing Script', cursive;
        }

        .message-body {
            line-height: 1.6;
            color: #4a4a4a;
            font-family: 'Dancing Script', cursive;
            font-size: 22px;
            min-height: 80px;
        }
    </style>
</head>
<body>

    <div class="floating-heart" style="left: 10%; animation-delay: 0s;">❤️</div>
    <div class="floating-heart" style="left: 30%; animation-delay: 2s;">💖</div>
    <div class="floating-heart" style="left: 70%; animation-delay: 1s;">💗</div>
    <div class="floating-heart" style="left: 85%; animation-delay: 3s;">💓</div>

    <!-- Màn hình 1: Bông hoa nghiêng giống TikTok -->
    <div id="welcome-screen">
        <div class="rose-container">
            <svg viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Cành hoa nghiêng -->
                <path d="M125 105 Q100 145 65 185" stroke="#558b2f" stroke-width="7" stroke-linecap="round"/>
                
                <!-- Lá trái -->
                <path d="M88 158 C70 150 62 125 75 125 C88 125 95 142 88 158 Z" fill="#689f38" stroke="#33691e" stroke-width="1.5"/>
                <!-- Lá phải -->
                <path d="M102 140 C125 138 135 152 120 162 C105 172 98 152 102 140 Z" fill="#689f38" stroke="#33691e" stroke-width="1.5"/>
                
                <!-- Đài hoa -->
                <path d="M110 102 L132 108 L122 92 Z" fill="#558b2f"/>

                <!-- Các cánh hoa hồng xếp lớp -->
                <!-- Cánh nền phía sau -->
                <path d="M100 80 C80 60 85 30 115 25 C145 20 165 45 150 75 C138 98 112 95 100 80 Z" fill="#ad1457"/>
                
                <!-- Cánh ngoài bên trái -->
                <path d="M92 65 C80 40 105 20 130 25 C140 45 125 75 102 78 C90 80 88 72 92 65 Z" fill="#c2185b"/>
                
                <!-- Cánh xòe nhọn bên phải (đặc trưng trong hình) -->
                <path d="M135 38 C155 32 170 42 165 52 C158 65 142 68 135 58 C130 50 132 40 135 38 Z" fill="#d81b60"/>
                
                <!-- Cánh chính giữa -->
                <path d="M105 52 C100 35 122 28 138 35 C148 48 138 68 122 70 C110 72 102 62 105 52 Z" fill="#e91e63"/>
                
                <!-- Nụ/Lớp cuộn phía trong -->
                <path d="M115 42 C110 32 126 28 134 35 C138 42 132 50 124 50 C118 50 112 46 115 42 Z" fill="#f48fb1"/>
            </svg>
        </div>
        
        <!-- Nút Click dạng chữ đỏ giống hệt TikTok -->
        <button class="click-btn-text" onclick="openLetter()">
            Click me now !
        </button>
    </div>

    <!-- Màn hình 2: Bức thư chúc mừng -->
    <div id="letter-screen">
        <div class="letter-header">
            <span>From With Love 20/10</span>
            <span>Happy Women's Day!</span>
        </div>
        <div class="letter-content">
            <div class="gift-box-area">
                <svg viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 70V95" stroke="#999" stroke-width="2" stroke-dasharray="2 2"/>
                    <path d="M50 15C35 -2 10 10 10 30C10 50 50 70 50 70C50 70 90 50 90 30C90 10 65 -2 50 15Z" fill="#ff4081"/>
                    <rect x="30" y="95" width="40" height="25" fill="#f44336" rx="3"/>
                    <rect x="27" y="90" width="46" height="7" fill="#e53935" rx="2"/>
                    <path d="M50 90V120" stroke="#ffeb3b" stroke-width="4"/>
                    <path d="M30 105H70" stroke="#ffeb3b" stroke-width="4"/>
                </svg>
            </div>
            <div class="message-title">Gửi cậu!</div>
            <div class="message-body" id="typed-text"></div>
        </div>
    </div>

    <script>
        const fullMessage = "Hôm nay là ngày 20/10. Xin gửi lời chúc tới người tớ yêu thương nhất. Luôn vui vẻ, luôn hạnh phúc và luôn may mắn trong cuộc sống, ngày càng xinh đẹp. Xin gửi tất cả lời chúc tốt đẹp đến cậu. Love You <3";
        
        function openLetter() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('letter-screen').style.display = 'block';

            let i = 0;
            const speed = 50;
            function typeWriter() {
                if (i < fullMessage.length) {
                    document.getElementById("typed-text").innerHTML += fullMessage.charAt(i);
                    i++;
                    setTimeout(typeWriter, speed);
                }
            }
            setTimeout(typeWriter, 400);
        }
    </script>
</body>
</html>
