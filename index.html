<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chúc bạn nớ ngủ ngonnnn 💗</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7, #ffeef5);
    }

    .container {
      width: 90%;
      max-width: 500px;
      padding: 35px 25px;
      text-align: center;
      background: rgba(255,255,255,0.75);
      border-radius: 30px;
      box-shadow: 0 15px 50px rgba(255, 80, 130, 0.25);
      backdrop-filter: blur(10px);
    }

    .heart {
      font-size: 90px;
      animation: heartbeat 1.2s infinite;
      margin-bottom: 15px;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.15);
      }
    }

    h1 {
      color: #ff4f81;
      font-size: 34px;
      margin-bottom: 12px;
    }

    p {
      color: #777;
      font-size: 18px;
      margin-bottom: 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      min-height: 60px;
      position: relative;
    }

    button {
      border: none;
      padding: 14px 30px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    #yes {
      background: #ff4f81;
      color: white;
      box-shadow: 0 7px 20px rgba(255, 79, 129, .35);
    }

    #yes:hover {
      transform: scale(1.08);
    }

    #no {
      background: white;
      color: #ff4f81;
      border: 2px solid #ffb2c8;
      position: relative;
    }

    .message {
      display: none;
      margin-top: 25px;
      animation: appear .5s ease;
    }

    .message h2 {
      color: #ff3f78;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .message p {
      color: #666;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(.7);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .floating-heart {
      position: fixed;
      bottom: -30px;
      font-size: 25px;
      pointer-events: none;
      animation: floatUp 5s linear forwards;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="heart">❤️</div>

    <h1>Chúc bạn Bùi Thảo Nhi Ngủ ngonn nhóoo 💕</h1>

    <p>Ngủ sớm đi kẻo mệt đọ... 🥺</p>

    <div class="buttons">
      <button id="yes">Daaaaa❤️</button>
      <button id="no">Không 😭</button>
    </div>

    <div class="message" id="message">
      <h2>ngủ ngon nhoo công túa! 💗</h2>
      <p>mơ đẹp 🥰</p>
      <div style="font-size:50px;margin-top:15px;">💖💗💓💞💕</div>
    </div>

  </div>

  <script>
    const yesButton = document.getElementById("yes");
    const noButton = document.getElementById("no");
    const message = document.getElementById("message");

    yesButton.addEventListener("click", () => {
      message.style.display = "block";
      yesButton.style.display = "none";
      noButton.style.display = "none";

      for (let i = 0; i < 25; i++) {
        setTimeout(createHeart, i * 100);
      }
    });

    function moveNoButton() {
      const buttonWidth = noButton.offsetWidth;
      const buttonHeight = noButton.offsetHeight;

      // Giới hạn trong khung nhìn màn hình để nút không bị tràn ra ngoài mất hút
      const maxX = window.innerWidth - buttonWidth - 40;
      const maxY = window.innerHeight - buttonHeight - 40;

      const x = Math.max(20, Math.random() * maxX);
      const y = Math.max(20, Math.random() * maxY);

      noButton.style.position = "fixed";
      noButton.style.left = x + "px";
      noButton.style.top = y + "px";
      noButton.style.zIndex = "9999";
    }

    // Dùng mouseover thay vì mouseenter để nhạy vừa phải, tránh bị giật mất chữ ngay lập tức
    noButton.addEventListener("mouseover", moveNoButton);

    // Bỏ e.preventDefault() ở touchstart để điện thoại vẫn có thể chạm vào mượt mà hơn mà không bị lỗi khựng/biến mất dị thường
    noButton.addEventListener("touchstart", function(e) {
      moveNoButton();
    });

    function createHeart() {
      const heart = document.createElement("div");

      heart.className = "floating-heart";
      heart.innerHTML = ["❤️","💗","💖","💕","💓"][Math.floor(Math.random() * 5)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (18 + Math.random() * 30) + "px";
      heart.style.animationDuration = (3 + Math.random() * 3) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createHeart, 700);
  </script>

</body>
</html>
