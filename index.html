<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Women's Day 20/10</title>
    <!-- Nhúng font chữ viết tay lãng mạn Dancing Script -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Hiệu ứng trái tim bay nền */
        .floating-heart {
            position: absolute;
            color: #ff4081;
            font-size: 20px;
            animation: flyUp 4s linear infinite;
            opacity: 0.7;
            z-index: 1;
        }

        @keyframes flyUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        /* Màn hình 1: Bông hồng và nút Click */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.8s ease;
        }

        .rose-container {
            width: 220px;
            height: 250px;
            margin-bottom: 20px;
            animation: floatRose 3s ease-in-out infinite;
        }

        @keyframes floatRose {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .rose-container svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1));
        }

        .click-btn {
            background: linear-gradient(45deg, #ff4081, #ff80ab);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .click-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(255, 64, 129, 0.6);
        }

        /* Màn hình 2: Bức thư phong bì */
        #letter-screen {
            display: none;
            position: absolute;
            width: 90%;
            max-width: 550px;
            background: #fff0f3;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            padding: 30px 20px;
            text-align: center;
            z-index: 20;
            transform: scale(0);
            animation: zoomIn 0.8s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px dashed #ff80ab;
        }

        @keyframes zoomIn {
            to {
                transform: scale(1);
            }
        }

        .letter-header {
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            color: #d81b60;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .letter-content {
            background: #ffffff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
        }

        .gift-box-area {
            width: 100px;
            height: 120px;
            margin: 0 auto 15px auto;
            animation: bounceGift 2s ease-in-out infinite;
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .gift-box-area svg {
            width: 100%;
            height: 100%;
        }

        .message-title {
            font-size: 22px;
            font-weight: 700;
            color: #c2185b;
            margin-bottom: 10px;
            font-family: 'Dancing Script', cursive;
        }

        .message-body {
            font-size: 16px;
            line-height: 1.6;
            color: #4a4a4a;
            font-family: 'Dancing Script', cursive;
            font-size: 22px;
            min-height: 80px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Các trái tim bay nền trang trí -->
    <div class="floating-heart" style="left: 10%; animation-delay: 0s;">❤️</div>
    <div class="floating-heart" style="left: 30%; animation-delay: 2s;">💖</div>
    <div class="floating-heart" style="left: 70%; animation-delay: 1s;">💗</div>
    <div class="floating-heart" style="left: 85%; animation-delay: 3s;">💓</div>

    <!-- Màn hình 1: Bông hoa hồng -->
    <div id="welcome-screen">
        <div class="rose-container">
            <!-- Hình vẽ SVG bông hoa hồng cách điệu line art -->
            <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Thân và lá -->
                <path d="M100 110V180C100 185 95 190 90 190" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
                <path d="M100 140C80 130 70 140 60 130C50 120 65 110 85 125Z" fill="#81C784" stroke="#4CAF50" stroke-width="3"/>
                <path d="M100 160C120 155 130 165 140 155C150 145 135 135 115 150Z" fill="#81C784" stroke="#4CAF50" stroke-width="3"/>
                <!-- Cánh hoa hồng -->
                <path d="M100 110C70 110 50 85 60 60C65 45 80 35 100 50C120 35 135 45 140 60C150 85 130 110 100 110Z" fill="#ff80ab" stroke="#c2185b" stroke-width="4"/>
                <path d="M100 50C90 70 110 90 100 110C90 90 110 70 100 50Z" fill="#ff4081" stroke="#c2185b" stroke-width="3"/>
                <path d="M75 65C85 65 95 75 100 90C85 85 70 80 75 65Z" fill="#ff4081" stroke="#c2185b" stroke-width="2"/>
                <path d="M125 65C115 65 105 75 100 90C115 85 130 80 125 65Z" fill="#ff4081" stroke="#c2185b" stroke-width="2"/>
            </svg>
        </div>
        <button class="click-btn" onclick="openLetter()">
            Click me now ! 💌
        </button>
    </div>

    <!-- Màn hình 2: Bức thư hiển thị nội dung -->
    <div id="letter-screen">
        <div class="letter-header">
            <span>From With Love 20/10</span>
            <span>Happy Women's Day!</span>
        </div>
        <div class="letter-content">
            <div class="gift-box-area">
                <!-- Hình ảnh bong bóng trái tim và hộp quà SVG -->
                <svg viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 70V95" stroke="#999" stroke-width="2" stroke-dasharray="2 2"/>
                    <!-- Trái tim bóng bay -->
                    <path d="M50 15C35 -2 10 10 10 30C10 50 50 70 50 70C50 70 90 50 90 30C90 10 65 -2 50 15Z" fill="#ff4081"/>
                    <!-- Hộp quà -->
                    <rect x="30" y="95" width="40" height="25" fill="#f44336" rx="3"/>
                    <rect x="27" y="90" width="46" height="7" fill="#e53935" rx="2"/>
                    <path d="M50 90V120" stroke="#ffeb3b" stroke-width="4"/>
                    <path d="M30 105H70" stroke="#ffeb3b" stroke-width="4"/>
                </svg>
            </div>
            <div class="message-title">Gửi cậu!</div>
            <div class="message-body" id="typed-text"></div>
        </div>
    </div>

    <script>
        const fullMessage = "Hôm nay là ngày 20/10. Xin gửi lời chúc tới người tớ yêu thương nhất. Luôn vui vẻ, luôn hạnh phúc và luôn may mắn trong cuộc sống, ngày càng xinh đẹp. Xin gửi tất cả lời chúc tốt đẹp đến cậu. Love You <3";
        
        function openLetter() {
            // Ẩn màn hình hoa hồng, hiện màn hình phong bì thư
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('letter-screen').style.display = 'block';

            // Hiệu ứng chữ chạy (typing effect) từng chữ giống trong video
            let i = 0;
            const speed = 50; // Tốc độ chạy chữ (mili-giây)
            function typeWriter() {
                if (i < fullMessage.length) {
                    document.getElementById("typed-text").innerHTML += fullMessage.charAt(i);
                    i++;
                    setTimeout(typeWriter, speed);
                }
            }
            
            // Chạy hiệu ứng chữ sau khi khung thư zoom xong
            setTimeout(typeWriter, 500);
        }
    </script>
</body>
</html>
